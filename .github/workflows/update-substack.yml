name: Update Substack posts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-substack-posts
  cancel-in-progress: true

jobs:
  update-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest posts
        run: python update_posts.py
      - name: Commit changes
        id: update
        run: |
          if git diff --quiet -- posts.json; then
            echo "Posts are already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "Update Substack posts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
